<main id="main-content" class="dashboard-layout" [class.is-blurred]="isProfileOpen">

  <aside class="sidebar" [class.mobile-hidden]="activeMobileView === 'chat'">
    <app-user-list #userList (readSince)="unreadSince = $event" (chatSelected)="openChat($event)"
      (settingsClicked)="openProfile()"></app-user-list>
  </aside>

  <section class="chat-area" [class.mobile-hidden]="activeMobileView === 'list'">
    <app-chat [selectedUser]="selectedUser" [unreadSince]="unreadSince" (backClicked)="showList()"
      (startGroup)="startGroup(userList, $event)"
      (conversationLeft)="onConversationLeft(userList)"></app-chat>
  </section>



</main>

@if (isProfileOpen) {
<!-- Clicking outside the card saves and closes the profile (handled in Profile). -->
<div class="profile-overlay" role="dialog" aria-modal="true" aria-label="Profil szerkesztes">
  <div class="profile-modal-shell">
    <app-profile (closeRequested)="closeProfile()"></app-profile>
  </div>
</div>
}
