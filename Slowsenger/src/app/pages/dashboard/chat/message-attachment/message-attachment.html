@let item = attachment();
@if (item.kind === 'gif') {
  <img class="media" [src]="item.url" [width]="item.width" [height]="item.height" [alt]="item.title" draggable="false">
} @else if (isPicture() && fileUrl(); as url) {
  <a class="media-link" [href]="url" [download]="item.name" [title]="'Download ' + item.name">
    <img class="media" [src]="url" [alt]="item.name" draggable="false">
  </a>
} @else {
  <a class="file" [attr.href]="fileUrl() || null" [attr.download]="fileUrl() ? item.name : null"
    [class.is-missing]="fileUrl() === null" [attr.aria-disabled]="fileUrl() === null">
    <span class="icon" aria-hidden="true">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
        stroke-linecap="round" stroke-linejoin="round">
        <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z" />
        <path d="M14 3v5h5" />
      </svg>
    </span>
    <span class="meta">
      <span class="name">{{ item.name }}</span>
      <span class="size">{{ fileUrl() === null ? 'Not on this device' : size() }}</span>
    </span>
  </a>
}
