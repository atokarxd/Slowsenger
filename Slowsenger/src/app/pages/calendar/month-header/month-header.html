<div class="month-title">
  @for (title of [title()]; track title.key) {
    <div class="title-text" [attr.data-slide]="slide() || null">
      <h1>{{ title.name }}</h1>
      <span class="year">{{ title.year }}</span>
    </div>
  }
</div>

<div class="month-nav">
  <button type="button" class="nav-btn" aria-label="Previous month" (click)="previousClicked.emit()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="15 18 9 12 15 6"></polyline>
    </svg>
  </button>
  <button type="button" class="nav-btn is-text" (click)="todayClicked.emit()">Today</button>
  <button type="button" class="nav-btn" aria-label="Next month" (click)="nextClicked.emit()">
    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
      stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="9 18 15 12 9 6"></polyline>
    </svg>
  </button>
</div>
